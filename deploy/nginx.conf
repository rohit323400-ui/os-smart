# ====================================================================
# 🛡️ RAAH NAGAR - PRODUCTION REVERSE PROXY CONFIGURATION (NGINX)
# ====================================================================
# Architecture:
# - Nginx acts as the TLS termination layer (HTTPS / WSS on Port 443).
# - Static assets (Vite frontend build) served directly with aggressive caching.
# - Node.js Express process runs on internal port 5000 (app.set('trust proxy', 1)).
# - WebSockets upgraded transparently for low-latency telemetry streaming.
# ====================================================================

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name society.yourdomain.com; # Replace with your production domain

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Terminate TLS & Proxy to Node.js backend
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name society.yourdomain.com; # Replace with your production domain

    # SSL Certificates (managed via Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/society.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/society.yourdomain.com/privkey.pem;

    # Modern TLS Security Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Frontend Static Distribution (Built via `npm run build`)
    root /var/www/raahnagar/dist;
    index index.html;

    # Frontend SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # REST API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Secure WebSocket (WSS) Telemetry Stream
    location /ws {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Keep alive long-running telemetry connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
